<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="日常打卡">
  <meta name="description" content="在 iPhone 上记录习惯，用圆点日历浏览打卡进度。">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="style.css?v=3">
  <script src="app.js?v=3" defer></script>
  <title>日常打卡</title>
</head>
<body>
  <div id="app"></div>
  <div id="notice" role="status" class="notice" hidden></div>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="habit-form">
      <div class="dialog-head">
        <h2 id="editor-title">添加习惯</h2>
        <button class="icon-button" type="button" data-action="close-editor" aria-label="关闭">×</button>
      </div>
      <label for="habit-name">习惯名称</label>
      <input id="habit-name" name="name" type="text" placeholder="例如：读书" maxlength="16" required>
      <fieldset>
        <legend>图标</legend>
        <div id="icon-options" class="options"></div>
      </fieldset>
      <fieldset id="habit-colors">
        <legend>颜色</legend>
        <div id="tone-options" class="options"></div>
      </fieldset>
      <button class="primary" type="submit">保存习惯</button>
      <div id="edit-actions" class="edit-actions" hidden>
        <button id="archive-action" class="secondary" type="button" data-action="archive-edited">归档习惯</button>
        <button class="danger-link" type="button" data-action="ask-delete">删除习惯</button>
      </div>
      <section id="delete-confirmation" class="delete-confirmation" aria-labelledby="delete-title" hidden>
        <h3 id="delete-title">删除习惯？</h3>
        <p id="delete-description"></p>
        <div class="confirm-actions">
          <button class="secondary" type="button" data-action="cancel-delete">取消</button>
          <button class="danger" type="button" data-action="delete-habit">确认删除</button>
        </div>
      </section>
    </form>
  </dialog>
  <dialog id="manager" class="manage-dialog" aria-labelledby="manager-title">
    <div class="dialog-head">
      <h2 id="manager-title">管理习惯</h2>
      <button class="icon-button" type="button" data-action="close-manager" aria-label="关闭">×</button>
    </div>
    <div id="manager-list"></div>
  </dialog>
</body>
</html>
